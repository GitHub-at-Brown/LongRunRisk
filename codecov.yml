# Codecov configuration
# https://docs.codecov.com/docs/codecov-yaml

coverage:
  status:
    project:
      default:
        # Don't fail PR checks due to coverage changes
        informational: true
    patch:
      default:
        # Don't fail PR checks due to patch coverage
        informational: true

comment:
  # Post coverage comments on PRs
  layout: "reach,diff,flags,files"
  behavior: default
  require_changes: false

# Use develop as the default branch for base commit comparison
codecov:
  branch: develop
