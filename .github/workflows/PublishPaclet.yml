name: Submit
on: 
  workflow_dispatch:
  push: 
    branches:  ['release/*']
env:
  RESOURCE_PUBLISHER_TOKEN: ${{ secrets.RESOURCE_PUBLISHER_TOKEN }}
  WOLFRAMSCRIPT_ENTITLEMENTID: ${{ secrets.WOLFRAMSCRIPT_ENTITLEMENTID }}
  # Ensure WolframKernel always starts with the entitlement (prevents "No valid password found")
  WOLFRAMINIT: -pwfile !cloudlm.wolfram.com -entitlement ${{ secrets.WOLFRAMSCRIPT_ENTITLEMENTID }}
  WLPR_PACLET_SITE: https://resources.wolframcloud.com/PacletRepository/pacletsite
  ENGINE_TAG: 14.3.0
  PACLET_CICD_VERSION: 0.36.2
jobs: 
  Submit: 
    name: Submit
    runs-on: ubuntu-latest
    container: 
      image: wolframresearch/wolframengine:14.3.0
      options: --user root
    env: 
      WOLFRAM_SYSTEM_ID: Linux-x86-64
    steps:
    - name: Checkout
      id: checkout-code-step
      uses: actions/checkout@v5
    - name: Install dependencies
      run: |
        apt-get update -y
        apt-get install -y perl ghostscript wget lcov bc
    - name: Restore TinyTeX cache
      id: cache-tinytex
      uses: actions/cache@v5
      with:
        path: |
          /github/home/bin
          /github/home/.TinyTeX
        key: tinytex-${{ runner.os }}-latex-standalone-lm-svn-prov-v1
        restore-keys: |
          tinytex-${{ runner.os }}-
    - name: Install TinyTeX
      if: steps.cache-tinytex.outputs.cache-hit != 'true'
      run: wget -qO- "https://yihui.org/tinytex/install-bin-unix.sh" | sh
    - name: Add latex to path
      run: echo "$HOME/bin" >> $GITHUB_PATH
    - name: Install LaTeX packages for MaTeX
      if: steps.cache-tinytex.outputs.cache-hit != 'true'
      run: |
        tlmgr update --self --all
        tlmgr path add
        fmtutil-sys --all
        tlmgr install latex standalone lm svn-prov
        tlmgr path add
    - name: Run coverage
      run: wolframscript Tests/RunCoverage.wls
    - name: Generate coverage report
      run: |
        # Only generate HTML if real coverage data exists (DA: lines)
        if grep -q "^DA:" build/coverage/baseline.lcov 2>/dev/null; then
          lcov --ignore-errors empty,corrupt -a build/coverage/baseline.lcov -a build/coverage/tests.lcov -o build/coverage/combined.lcov
          genhtml --ignore-errors empty,corrupt,category --num-spaces 4 --title "LongRunRisk Coverage" build/coverage/combined.lcov -o build/coverage/html
          lcov --ignore-errors empty,corrupt --summary build/coverage/combined.lcov
        else
          echo "Coverage tracking disabled (Instrumentation paclet bug with Compile). Skipping HTML report."
        fi
    - name: Upload coverage report
      uses: actions/upload-artifact@v5
      if: always()
      with:
        name: coverage-report
        path: build/coverage/
        if-no-files-found: ignore
    - name: Submit
      id: submit-paclet-step
      uses: WolframResearch/submit-paclet@v1.11.0
      with: 
        paclet_cicd_version: ${{ env.PACLET_CICD_VERSION }}
        definition_notebook: ./ResourceDefinition.nb
        resource_system_base: https://www.wolframcloud.com/obj/resourcesystem/api/1.0
    - name: UploadArtifact
      id: upload-build-artifacts-step
      uses: actions/upload-artifact@v5
      with:
        path: ${{ env.PACLET_BUILD_DIR }}
        if-no-files-found: ignore
    - name: UploadWorkflowValues
      id: upload-workflow-values-step
      if: always() && env.PACLET_WORKFLOW_VALUES
      uses: actions/upload-artifact@v5
      with:
        name: paclet-workflow-values
        path: ${{ env.PACLET_WORKFLOW_VALUES }}
        if-no-files-found: ignore
