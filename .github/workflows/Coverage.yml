name: Coverage
on:
  workflow_dispatch:
    inputs:
      coverage_mode:
        description: 'Coverage mode: Auto (try execution, fallback to baseline), Baseline (structure only), Execution (fail if CoverageEvaluate fails)'
        required: false
        default: 'Auto'
        type: choice
        options:
          - Auto
          - Baseline
          - Execution
env:
  WOLFRAMSCRIPT_ENTITLEMENTID: ${{ secrets.WOLFRAMSCRIPT_ENTITLEMENTID }}
  ENGINE_TAG: 14.3.0
jobs:
  Coverage:
    name: Coverage
    runs-on: ubuntu-latest
    container:
      image: wolframresearch/wolframengine:14.3.0
      options: --user root --privileged --init
    env:
      WOLFRAM_SYSTEM_ID: Linux-x86-64
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install dependencies
        run: |
          apt-get update -y
          apt-get install -y perl ghostscript wget lcov bc build-essential
      - name: Restore TinyTeX cache
        id: cache-tinytex
        uses: actions/cache@v5
        with:
          path: |
            /github/home/bin
            /github/home/.TinyTeX
          key: tinytex-${{ runner.os }}-latex-standalone-lm-svn-prov-v1
          restore-keys: |
            tinytex-${{ runner.os }}-
      - name: Install TinyTeX
        if: steps.cache-tinytex.outputs.cache-hit != 'true'
        run: wget -qO- "https://yihui.org/tinytex/install-bin-unix.sh" | sh
      - name: Add latex to path
        run: echo "$HOME/bin" >> $GITHUB_PATH
      - name: Install LaTeX packages for MaTeX
        if: steps.cache-tinytex.outputs.cache-hit != 'true'
        run: |
          tlmgr update --self --all
          tlmgr path add
          fmtutil-sys --all
          tlmgr install latex standalone lm svn-prov
          tlmgr path add
      - name: Run coverage
        run: wolframscript Tests/RunCoverage.wls --mode=${{ inputs.coverage_mode || 'Auto' }}
      - name: Generate HTML report
        run: |
          # Only generate HTML if real coverage data exists (DA: lines)
          if grep -q "^DA:" build/coverage/baseline.lcov 2>/dev/null; then
            lcov --ignore-errors empty,corrupt -a build/coverage/baseline.lcov -a build/coverage/tests.lcov -o build/coverage/combined.lcov
            genhtml --ignore-errors empty,corrupt,category --num-spaces 4 --title "LongRunRisk Coverage" build/coverage/combined.lcov -o build/coverage/html
            lcov --ignore-errors empty,corrupt --summary build/coverage/combined.lcov
          else
            echo "Note: LCOV files do not contain DA: lines (baseline coverage only). Generating report anyway."
            lcov --ignore-errors empty,corrupt -a build/coverage/baseline.lcov -a build/coverage/tests.lcov -o build/coverage/combined.lcov || true
            genhtml --ignore-errors empty,corrupt,category --num-spaces 4 --title "LongRunRisk Coverage (Baseline)" build/coverage/combined.lcov -o build/coverage/html || true
          fi
      - name: Upload coverage report
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: coverage-report
          path: build/coverage/
          if-no-files-found: ignore
