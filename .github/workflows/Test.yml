name: Test
on:
  workflow_dispatch:
  push:
    branches: [develop]
  pull_request:
    branches: [main, develop]
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true
env:
  WOLFRAMSCRIPT_ENTITLEMENTID: ${{ secrets.WOLFRAMSCRIPT_ENTITLEMENTID }}
  WOLFRAMINIT: -pwfile !cloudlm.wolfram.com -entitlement ${{ secrets.WOLFRAMSCRIPT_ENTITLEMENTID }}
  PACLET_CICD_VERSION: 0.36.2
jobs:
  Test:
    name: Test
    runs-on: ubuntu-latest
    container:
      image: wolframresearch/wolframengine:14.3.0
      options: --user root --privileged --init
    env:
      WOLFRAM_SYSTEM_ID: Linux-x86-64
      CC: /usr/bin/gcc
      CXX: /usr/bin/g++
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Wolfram environment
        uses: ./.github/actions/setup-wolfram-env
        with:
          wolframscript-entitlementid: ${{ secrets.WOLFRAMSCRIPT_ENTITLEMENTID }}

      - name: Commit MX files if updated
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          # Check if there are new/modified MX files in the platform subfolder
          if [ -n "$(git status --porcelain Resources/CompiledFunctions/Linux-x86-64/)" ]; then
            echo "MX files were updated, committing..."
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add Resources/CompiledFunctions/Linux-x86-64/*.mx
            git commit -m "Update compiled MX files for Linux-x86-64"
            git push
          else
            echo "No MX file changes to commit"
          fi

      - name: Test
        id: test-paclet-step
        env:
          PACLET_CICD_VERSION: ${{ env.PACLET_CICD_VERSION }}
          DEBUG: "true"
        run: wolframscript -f Tests/RunTests.wls

      - name: Upload workflow values
        if: always() && env.PACLET_WORKFLOW_VALUES
        uses: actions/upload-artifact@v5
        with:
          name: test-workflow-values
          path: ${{ env.PACLET_WORKFLOW_VALUES }}
          if-no-files-found: ignore

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-results
          path: build/test-results/
          if-no-files-found: ignore
