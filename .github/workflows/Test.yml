name: Test
on:
  workflow_dispatch:
    inputs:
      test_category:
        description: 'Test category to run'
        required: false
        default: 'core'
        type: choice
        options:
          - core
          - extended
          - all
      with_coverage:
        description: 'Run with coverage instrumentation'
        required: false
        default: false
        type: boolean
      coverage_mode:
        description: 'Coverage mode (only if coverage enabled)'
        required: false
        default: 'Auto'
        type: choice
        options:
          - Auto
          - Baseline
          - Execution
  pull_request:
    branches: [main, develop]
concurrency:
  group: test-${{ github.ref }}-${{ inputs.test_category || 'core' }}
  cancel-in-progress: true
env:
  WOLFRAMSCRIPT_ENTITLEMENTID: ${{ secrets.WOLFRAMSCRIPT_ENTITLEMENTID }}
  WOLFRAMINIT: -pwfile !cloudlm.wolfram.com -entitlement ${{ secrets.WOLFRAMSCRIPT_ENTITLEMENTID }}
  PACLET_CICD_VERSION: 0.36.2
jobs:
  Test:
    name: Test
    runs-on: ubuntu-latest
    container:
      image: wolframresearch/wolframengine:14.3.0
      options: --user root --privileged --init
    env:
      WOLFRAM_SYSTEM_ID: Linux-x86-64
      CC: /usr/bin/gcc
      CXX: /usr/bin/g++
    timeout-minutes: ${{ fromJSON('{"core":60,"extended":360,"all":420}')[inputs.test_category || 'core'] }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install lcov (for coverage)
        if: inputs.with_coverage == true
        run: apt-get update -y && apt-get install -y lcov bc

      - name: Setup Wolfram environment
        uses: ./.github/actions/setup-wolfram-env
        with:
          wolframscript-entitlementid: ${{ secrets.WOLFRAMSCRIPT_ENTITLEMENTID }}

      - name: Commit MX files if updated
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          # Check if there are new/modified MX files in the platform subfolder
          if [ -n "$(git status --porcelain Resources/CompiledFunctions/Linux-x86-64/)" ]; then
            echo "MX files were updated, committing..."
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add Resources/CompiledFunctions/Linux-x86-64/*.mx
            git commit -m "Update compiled MX files for Linux-x86-64"
            git push
          else
            echo "No MX file changes to commit"
          fi

      - name: Test
        id: test-paclet-step
        env:
          PACLET_CICD_VERSION: ${{ env.PACLET_CICD_VERSION }}
          DEBUG: "true"
        run: |
          CATEGORY="${{ inputs.test_category || 'core' }}"
          echo "Running tests with category: $CATEGORY"

          if [ "${{ inputs.with_coverage }}" == "true" ]; then
            echo "Coverage instrumentation enabled..."
            wolframscript -f Tests/RunTests.wls --cicd --test-category "$CATEGORY" --coverage --coverage-mode "${{ inputs.coverage_mode || 'Auto' }}"
          else
            wolframscript -f Tests/RunTests.wls --cicd --test-category "$CATEGORY"
          fi

      - name: Generate HTML coverage report
        if: inputs.with_coverage == true
        run: |
          if grep -q "^DA:" build/coverage/baseline.lcov 2>/dev/null; then
            lcov --ignore-errors empty,corrupt -a build/coverage/baseline.lcov -a build/coverage/tests.lcov -o build/coverage/combined.lcov
            genhtml --ignore-errors empty,corrupt,category --num-spaces 4 --title "LongRunRisk Coverage" build/coverage/combined.lcov -o build/coverage/html
            lcov --ignore-errors empty,corrupt --summary build/coverage/combined.lcov
          else
            echo "Note: LCOV files do not contain DA: lines (baseline coverage only)."
            lcov --ignore-errors empty,corrupt -a build/coverage/baseline.lcov -a build/coverage/tests.lcov -o build/coverage/combined.lcov || true
            genhtml --ignore-errors empty,corrupt,category --num-spaces 4 --title "LongRunRisk Coverage (Baseline)" build/coverage/combined.lcov -o build/coverage/html || true
          fi

      - name: Upload to Codecov
        if: inputs.with_coverage == true
        uses: codecov/codecov-action@v5
        with:
          files: build/coverage/combined.lcov
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Upload workflow values
        if: always() && env.PACLET_WORKFLOW_VALUES
        uses: actions/upload-artifact@v5
        with:
          name: test-workflow-values
          path: ${{ env.PACLET_WORKFLOW_VALUES }}
          if-no-files-found: ignore

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-results
          path: build/test-results/
          if-no-files-found: ignore

      - name: Upload coverage report
        if: always() && inputs.with_coverage == true
        uses: actions/upload-artifact@v5
        with:
          name: coverage-report
          path: build/coverage/
          if-no-files-found: ignore
