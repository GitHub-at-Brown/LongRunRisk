name: Check-Test
on:
  workflow_dispatch:
  push:
    branches: [develop, "fix/gha-summary-truncation"]
  pull_request:
    branches: [main, develop]
concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true
env:
  RESOURCE_PUBLISHER_TOKEN: ${{ secrets.RESOURCE_PUBLISHER_TOKEN }}
  WOLFRAMSCRIPT_ENTITLEMENTID: ${{ secrets.WOLFRAMSCRIPT_ENTITLEMENTID }}
  # Ensure WolframKernel always starts with the entitlement (prevents "No valid password found")
  WOLFRAMINIT: -pwfile !cloudlm.wolfram.com -entitlement ${{ secrets.WOLFRAMSCRIPT_ENTITLEMENTID }}
  WLPR_PACLET_SITE: https://resources.wolframcloud.com/PacletRepository/pacletsite
  ENGINE_TAG: 14.3.0
  PACLET_CICD_VERSION: 0.36.2
jobs:
  Check-Test:
    name: Check-Test
    runs-on: ubuntu-latest
    container:
      image: wolframresearch/wolframengine:14.3.0
      options: --user root --privileged --init
    env:
      WOLFRAM_SYSTEM_ID: Linux-x86-64
      CC: /usr/bin/gcc
      CXX: /usr/bin/g++
    timeout-minutes: 360
    steps:
      - name: Checkout
        id: checkout-code-step
        uses: actions/checkout@v5   
      - name: Test
        id: test-paclet-step
        env:
          PACLET_CICD_VERSION: ${{ env.PACLET_CICD_VERSION }}
          DEBUG: "true"
          LONGRUNRISK_TESTS_DIR: Tests/_Debug
        run: wolframscript -f Tests/RunTests.wls
      - name: Debug step summary HTML
        if: always()
        run: |
          echo "=== build/test-results/step-summary.md ==="
          ls -la build/test-results || true
          test -f build/test-results/step-summary.md || exit 0
          echo "=== <table> lines (first 20) ==="
          grep -n "<table" build/test-results/step-summary.md | head -n 20 || true
          echo "=== width=100% checks (first 20) ==="
          grep -n "width=\\\"100%\\\"" build/test-results/step-summary.md | head -n 20 || true
      - name: Upload workflow values
        if: always() && env.PACLET_WORKFLOW_VALUES
        uses: actions/upload-artifact@v5
        with:
          name: test-workflow-values
          path: ${{ env.PACLET_WORKFLOW_VALUES }}
          if-no-files-found: ignore
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-results
          path: build/test-results/
          if-no-files-found: ignore
      # - name: Setup tmate session
      #   if: always()
      #   uses: mxschmitt/action-tmate@v3
      #   with:
      #     limit-access-to-actor: false
          
