name: Check-Test
on:
  workflow_dispatch:
  push:
    branches: [develop]
  pull_request:
    branches: [main]
concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true
env:
  RESOURCE_PUBLISHER_TOKEN: ${{ secrets.RESOURCE_PUBLISHER_TOKEN }}
  WOLFRAMSCRIPT_ENTITLEMENTID: ${{ secrets.WOLFRAMSCRIPT_ENTITLEMENTID }}
  # Ensure WolframKernel always starts with the entitlement (prevents "No valid password found")
  WOLFRAMINIT: -pwfile !cloudlm.wolfram.com -entitlement ${{ secrets.WOLFRAMSCRIPT_ENTITLEMENTID }}
  WLPR_PACLET_SITE: https://resources.wolframcloud.com/PacletRepository/pacletsite
  ENGINE_TAG: 14.3.0
  PACLET_CICD_VERSION: 0.36.2
jobs:
  Check-Test:
    name: Check-Test
    runs-on: ubuntu-latest
    container:
      image: wolframresearch/wolframengine:14.3.0
      options: --user root --privileged --init
    env:
      WOLFRAM_SYSTEM_ID: Linux-x86-64
    timeout-minutes: 360
    steps:
      - name: Install system dependencies
        run: |
          apt-get update -y
          apt-get install -y perl ghostscript wget git
      - name: Restore TinyTeX cache
        id: cache-tinytex
        uses: actions/cache@v5
        with:
          path: |
            /github/home/bin
            /github/home/.TinyTeX
          key: tinytex-${{ runner.os }}-latex-standalone-lm-svn-prov-v1
          restore-keys: |
            tinytex-${{ runner.os }}-
      - name: Install TinyTeX
        if: steps.cache-tinytex.outputs.cache-hit != 'true'
        run: wget -qO- "https://yihui.org/tinytex/install-bin-unix.sh" | sh
      - name: Checkout
        id: checkout-code-step
        uses: actions/checkout@v5   
      - name: Add latex to path
        run: echo "$HOME/bin" >> $GITHUB_PATH
      - name: Install LaTeX packages for MaTeX
        if: steps.cache-tinytex.outputs.cache-hit != 'true'
        env:
          TEXLIVE_DOWNLOADER: wget
        run: |
          # Work around occasional CTAN mirror failures on CI by pinning a
          # known-good TeX Live repository for tlmgr.
          for repo in \
            https://mirrors.rit.edu/CTAN/systems/texlive/tlnet \
            https://ctan.math.utah.edu/ctan/tex-archive/systems/texlive/tlnet \
            https://ftp.fau.de/ctan/systems/texlive/tlnet \
            https://mirror.ctan.org/systems/texlive/tlnet
          do
            echo "Trying TeX Live repository: $repo"
            if wget -q --spider --timeout=20 --tries=2 "$repo/tlpkg/texlive.tlpdb.sha512"; then
              echo "Using TeX Live repository: $repo"
              tlmgr option repository "$repo"
              break
            fi
          done
          tlmgr option repository
          tlmgr update --self --all
          tlmgr path add
          fmtutil-sys --all
          tlmgr --version
          tlmgr install latex standalone lm svn-prov
          tlmgr path add
          tlmgr list --only-installed 
      - name: Load paclet
        run: |
          wolframscript -code '
            Print["=== Starting paclet warmup ==="];
            Print["$SystemID: ", $SystemID];
            Print["Working directory: ", Directory[]];
            Print["Loading paclet directory..."];
            PacletDirectoryLoad["."];
            Print["Paclet directory loaded"];

            (* Step-by-step loading with timing *)
            Print["[1/6] Loading PacletizedResourceFunctions..."];
            t1 = AbsoluteTime[];
            Get["PacletizedResourceFunctions`"];
            Print["  Done in ", AbsoluteTime[] - t1, " seconds"];

            Print["[2/6] Installing/Loading MaTeX..."];
            t2 = AbsoluteTime[];
            Quiet@PacletizedResourceFunctions`NeedsDefinitions[
              FileNameJoin[{(First@PacletFind["MaTeXInstall"->"1.0.0"])["Location"],"Kernel","MaTeXInstall.wl"}]
            ];
            If[{}===PacletFind["MaTeX"],
              Print["  MaTeX not found, installing..."];
              MaTeXInstall`MaTeXInstall[]
            ];
            Needs["MaTeX`"];
            Print["  Done in ", AbsoluteTime[] - t2, " seconds"];

            Print["[3/6] Loading model sub-contexts..."];
            t3 = AbsoluteTime[];
            Needs["FernandoDuarte`LongRunRisk`Model`Parameters`"];
            Needs["FernandoDuarte`LongRunRisk`Model`Shocks`"];
            Needs["FernandoDuarte`LongRunRisk`Model`ExogenousEq`"];
            Needs["FernandoDuarte`LongRunRisk`Model`EndogenousEq`"];
            Print["  Done in ", AbsoluteTime[] - t3, " seconds"];

            Print["[4/6] Loading main package (definitions)..."];
            t4 = AbsoluteTime[];
            (* Load just the definitions, skip CheckModels for now *)
            Block[{FernandoDuarte`LongRunRisk`CheckModels = Null &},
              Needs["FernandoDuarte`LongRunRisk`"]
            ];
            Print["  Done in ", AbsoluteTime[] - t4, " seconds"];

            Print["[5/6] Running CheckModels..."];
            t5 = AbsoluteTime[];
            (* Now run CheckModels with verbose output *)
            result = FernandoDuarte`LongRunRisk`Tools`ManageResources`checkCatalogForUI[];
            Print["  checkCatalogForUI result: ", result];
            Print["  Done in ", AbsoluteTime[] - t5, " seconds"];

            Print["[6/6] Getting pipeline status..."];
            t6 = AbsoluteTime[];
            status = FernandoDuarte`LongRunRisk`Tools`ManageResources`getModelPipelineStatus[All];
            Print["  Pipeline status: ", status];
            Print["  Done in ", AbsoluteTime[] - t6, " seconds"];

            Print["=== Paclet warmup complete ==="]
          '
      - name: Commit MX files if updated
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          # Check if there are new/modified MX files in the platform subfolder
          if [ -n "$(git status --porcelain Resources/CompiledFunctions/Linux-x86-64/)" ]; then
            echo "MX files were updated, committing..."
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add Resources/CompiledFunctions/Linux-x86-64/*.mx
            git commit -m "Update compiled MX files for Linux-x86-64"
            git push
          else
            echo "No MX file changes to commit"
          fi
      - name: Test
        id: test-paclet-step
        uses: WolframResearch/test-paclet@v1.11.0
        with:
          debug: "true"
          paclet_cicd_version: ${{ env.PACLET_CICD_VERSION }}
        env:
          WOLFRAMSCRIPT_ENTITLEMENTID: ${{ secrets.WOLFRAMSCRIPT_ENTITLEMENTID }}
          RESOURCE_PUBLISHER_TOKEN: ${{ secrets.RESOURCE_PUBLISHER_TOKEN }}
      - name: Check
        id: check-paclet
        uses: WolframResearch/check-paclet@v1.11.0
        with:
          debug: "true"
          target: Check
          paclet_cicd_version: ${{ env.PACLET_CICD_VERSION }}
        env:
          WOLFRAMSCRIPT_ENTITLEMENTID: ${{ secrets.WOLFRAMSCRIPT_ENTITLEMENTID }}
          RESOURCE_PUBLISHER_TOKEN: ${{ secrets.RESOURCE_PUBLISHER_TOKEN }}
      - name: UploadWorkflowValues
        id: upload-workflow-values-step
        if: always() && env.PACLET_WORKFLOW_VALUES
        uses: actions/upload-artifact@v5
        with:
          name: paclet-workflow-values
          path: ${{ env.PACLET_WORKFLOW_VALUES }}
          if-no-files-found: ignore
      # - name: Setup tmate session
      #   if: always()
      #   uses: mxschmitt/action-tmate@v3
      #   with:
      #     limit-access-to-actor: false
          
